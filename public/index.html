<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06050c">
  <title>ร้องเลย — คาราโอเกะจาก YouTube</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff3d9a'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0714'/%3E%3Crect x='22' y='10' width='20' height='28' rx='10' fill='url(%23g)'/%3E%3Cpath d='M16 30a16 16 0 0 0 32 0M32 46v8M23 54h18' fill='none' stroke='%23f4f0ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div class="orbs" aria-hidden="true"></div>

  <noscript>
    <div class="noscript-banner" role="alert">ต้องเปิด JavaScript เพื่อใช้งาน</div>
  </noscript>

  <div id="app">
    <main id="stage-col">
      <header id="topbar">
        <div class="brand">
          <div class="logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v4" />
            </svg>
            <span>ร้องเลย</span>
          </div>
          <span class="brand-tagline">คาราโอเกะจาก YouTube</span>
        </div>
        <span class="topbar-spacer" aria-hidden="true"></span>
        <button id="btn-open-remote" type="button" class="chipbtn" aria-label="สั่งเพลงจากมือถือ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="7" y="2" width="10" height="20" rx="2" />
            <path d="M11 18h2" />
          </svg>
          <span>สั่งเพลงจากมือถือ</span>
        </button>
      </header>

      <section id="stage" class="iris" aria-label="จอเล่นวิดีโอคาราโอเกะ">
        <div id="player-wrap" class="player-wrap" hidden>
          <div id="player"></div>
        </div>

        <div id="stage-idle" class="stage-state">
          <div class="stage-idle-main">
            <svg class="idle-mic" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
              <defs>
                <linearGradient id="idle-mic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff3d9a" />
                  <stop offset="100%" stop-color="#33e1ff" />
                </linearGradient>
              </defs>
              <circle cx="42" cy="42" r="39" fill="rgba(255,61,154,0.08)" stroke="url(#idle-mic-grad)" stroke-width="2" />
              <rect x="32" y="18" width="20" height="30" rx="10" fill="url(#idle-mic-grad)" />
              <path d="M23 39a19 19 0 0 0 38 0M42 58v9M31 67h22" fill="none" stroke="#f4f0ff" stroke-width="3.2" stroke-linecap="round" />
            </svg>
            <p class="stage-message">พิมพ์ชื่อเพลง แล้วกด เข้าคิว</p>
          </div>
          <div id="stage-idle-qr" class="stage-idle-qr" hidden>
            <div class="qr-frame qr-frame-stage">
              <img id="stage-qr-img" alt="QR สำหรับเปิดหน้าสั่งเพลง" width="140" height="140">
            </div>
            <p class="stage-qr-caption">สแกนเพื่อสั่งเพลงจากมือถือ</p>
          </div>
        </div>

        <div id="stage-unavailable" class="stage-state" hidden>
          <svg class="stage-warn-icon" width="56" height="56" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="#ff3d9a" stroke-width="2" />
            <path d="M12 7v6M12 16.5v.5" fill="none" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <p class="stage-message">โหลดตัวเล่น YouTube ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่</p>
          <button id="btn-retry-player" type="button" class="btn-neon" aria-label="ลองโหลดตัวเล่น YouTube ใหม่">ลองใหม่</button>
        </div>
      </section>

      <section id="nowbar" class="glass" aria-label="เพลงที่กำลังเล่นและปุ่มควบคุม">
        <div class="nowbar-info">
          <span class="eyebrow">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
            กำลังร้อง
          </span>
          <h1 id="nowbar-title" class="nowbar-title">ยังไม่มีเพลงกำลังเล่น</h1>
          <div id="nowbar-meta" class="nowbar-meta" hidden>
            <span id="nowbar-duration" class="pill is-gold" hidden></span>
            <span id="nowbar-channel" class="nowbar-channel"></span>
            <span id="nowbar-by-sep" class="nowbar-sep" aria-hidden="true" hidden>·</span>
            <span id="nowbar-by" class="nowbar-by" hidden></span>
          </div>
          <p id="nowbar-next" class="nowbar-next">คิวว่าง — เพิ่มเพลงต่อได้เลย</p>
          <p id="nowbar-next-inline" class="nowbar-next-inline">คิวว่าง — เพิ่มเพลงต่อได้เลย</p>
        </div>

        <div class="nowbar-controls">
          <button id="btn-toggle" type="button" class="btn-white" aria-label="เล่น" title="เล่น–หยุด" disabled>
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor" />
            </svg>
            <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
            </svg>
            <span id="btn-toggle-label" class="nowbar-btn-label">เล่น</span>
          </button>
          <button id="btn-restart" type="button" class="btn-glass is-icon" aria-label="เริ่มใหม่" title="เริ่มใหม่" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" />
            </svg>
          </button>
          <button id="btn-skip" type="button" class="btn-glass" aria-label="ข้ามเพลง" title="ข้ามเพลง" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 5l10 7-10 7zM17 5h2v14h-2z" fill="currentColor" />
            </svg>
            <span class="nowbar-btn-label nowbar-skip-label">ข้ามเพลง</span>
          </button>
          <button id="btn-stage-mode" type="button" class="btn-glass is-icon" aria-label="โหมดเวที" aria-pressed="false" title="โหมดเวที">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <aside id="sidebar" class="glass iris" aria-label="ค้นหาเพลงและจัดการคิว">
      <div id="sync-status" class="sync-status" role="status" aria-live="polite" hidden>กำลังเชื่อมต่อเซิร์ฟเวอร์ใหม่…</div>

      <form id="search-form" class="search-form" role="search" novalidate>
        <div class="search-box">
          <span class="search-prefix" aria-hidden="true">คาราโอเกะ</span>
          <input
            id="search-input"
            type="search"
            name="q"
            placeholder="พิมพ์ชื่อเพลงหรือศิลปิน..."
            autocomplete="off"
            enterkeyhint="search"
            aria-label="ค้นหาเพลงคาราโอเกะ"
          >
          <button type="submit" class="btn-neon search-submit" aria-label="ค้นหา">ค้นหา</button>
        </div>
      </form>

      <p id="search-note" class="search-note" aria-live="polite"></p>

      <div class="tabs" role="tablist" aria-label="รายการเพลง">
        <button
          id="tab-results"
          type="button"
          class="tab"
          role="tab"
          aria-selected="true"
          aria-controls="panel-results"
          aria-label="ผลค้นหา"
        >
          <span class="tab-label">ผลค้นหา</span>
        </button>
        <button
          id="tab-queue"
          type="button"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-queue"
          aria-label="คิวเพลง"
        >
          <span class="tab-label">คิว</span>
          <span id="queue-count" class="tab-count">0</span>
        </button>
        <button
          id="tab-history"
          type="button"
          class="tab"
          role="tab"
          aria-selected="false"
          aria-controls="panel-history"
          aria-label="ร้องไปแล้ว"
        >
          <span class="tab-label">ร้องไปแล้ว</span>
        </button>
        <button
          id="tab-remote"
          type="button"
          class="tab tab-remote"
          role="tab"
          aria-selected="false"
          aria-controls="panel-remote"
          aria-label="สั่งเพลงจากมือถือ"
          title="สั่งเพลงจากมือถือ"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="2.5" width="10" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="18" r="1" fill="currentColor" />
          </svg>
          <span class="tab-label tab-remote-label">มือถือ</span>
        </button>
      </div>

      <section id="panel-results" class="panel" role="tabpanel" aria-labelledby="tab-results"></section>
      <section id="panel-queue" class="panel" role="tabpanel" aria-labelledby="tab-queue" hidden></section>
      <section id="panel-history" class="panel" role="tabpanel" aria-labelledby="tab-history" hidden></section>
      <section id="panel-remote" class="panel" role="tabpanel" aria-labelledby="tab-remote" hidden></section>
    </aside>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
