<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0714">
  <title>สั่งเพลง — ร้องเลย</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff3d9a'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0714'/%3E%3Crect x='22' y='10' width='20' height='28' rx='10' fill='url(%23g)'/%3E%3Cpath d='M16 30a16 16 0 0 0 32 0M32 46v8M23 54h18' fill='none' stroke='%23f4f0ff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/remote.css">
</head>
<body class="remote">
  <div id="r-backdrop" class="backdrop" aria-hidden="true"></div>
  <div class="orbs" aria-hidden="true"></div>
  <noscript>
    <div class="noscript-banner" role="alert">ต้องเปิด JavaScript เพื่อใช้งาน</div>
  </noscript>

  <div id="r-status" class="r-status" role="status" aria-live="polite" hidden></div>

  <main id="r-main" class="r-main">
    <div id="r-room-bar" class="r-room-bar" hidden>
      <span class="eyebrow r-room-label">ห้อง</span>
      <span id="r-room-name" class="pill r-room-name"></span>
    </div>

    <div class="r-name-wrap">
      <input
        id="r-name"
        class="r-name-input"
        type="text"
        maxlength="20"
        placeholder="ชื่อคนสั่งเพลง (ไม่ใส่ก็ได้)"
        autocomplete="nickname"
        aria-label="ชื่อคนสั่งเพลง (ไม่ใส่ก็ได้)"
      >
    </div>

    <div id="r-top" class="r-top">
      <form id="r-search-form" role="search" novalidate>
        <div class="search">
          <span class="k" aria-hidden="true">คาราโอเกะ</span>
          <input
            id="r-search-input"
            class="r-search-input"
            type="search"
            name="q"
            placeholder="พิมพ์ชื่อเพลงหรือศิลปิน..."
            autocomplete="off"
            enterkeyhint="search"
            aria-label="ค้นหาเพลงคาราโอเกะ"
          >
          <button type="submit" class="btn-neon r-search-submit" aria-label="ค้นหา">ค้นหา</button>
        </div>
      </form>

      <div class="r-tabs" role="tablist" aria-label="รายการเพลง">
        <button
          id="r-tab-results"
          type="button"
          class="r-tab"
          role="tab"
          aria-selected="true"
          aria-controls="r-panel-results"
          aria-label="ผลค้นหา"
        >
          <span class="tab-label">ผลค้นหา</span>
        </button>
        <button
          id="r-tab-queue"
          type="button"
          class="r-tab"
          role="tab"
          aria-selected="false"
          aria-controls="r-panel-queue"
          aria-label="คิวเพลง"
        >
          <span class="tab-label">คิว</span>
          <span id="r-queue-count" class="tab-count">0</span>
        </button>
      </div>
    </div>

    <p id="r-search-note" class="search-note" aria-live="polite"></p>

    <section id="r-panel-results" class="r-panel" role="tabpanel" aria-labelledby="r-tab-results"></section>
    <section id="r-panel-queue" class="r-panel" role="tabpanel" aria-labelledby="r-tab-queue" hidden></section>
  </main>

  <footer id="r-now" class="r-now" aria-label="เพลงที่กำลังเล่นและปุ่มควบคุม">
    <div class="r-now-inner">
      <div class="r-now-info">
        <span id="r-now-badge" class="eyebrow"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>กำลังร้อง</span>
        <p id="r-now-title" class="r-now-title" hidden></p>
        <p id="r-now-sub" class="r-now-sub">ยังไม่มีเพลงกำลังเล่น</p>
      </div>

      <div class="r-now-controls">
        <button id="r-btn-restart" type="button" class="btn-glass is-icon r-ctrl-btn" aria-label="เริ่มใหม่" title="เริ่มใหม่" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6v12M18 6l-9 6 9 6V6z" fill="currentColor" />
          </svg>
        </button>
        <button id="r-btn-toggle" type="button" class="btn-white is-icon r-ctrl-btn" aria-label="เล่น" title="เล่น–หยุด" disabled>
          <svg id="r-icon-play" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" fill="currentColor" />
          </svg>
          <svg id="r-icon-pause" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor" />
          </svg>
        </button>
        <button id="r-btn-skip" type="button" class="btn-glass is-icon r-ctrl-btn" aria-label="ข้ามเพลง" title="ข้ามเพลง" disabled>
          <svg id="r-icon-skip" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l9 6-9 6V6zM18 6v12" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span id="r-skip-confirm" class="r-skip-confirm-text" hidden>แน่ใจ?</span>
        </button>
      </div>
    </div>
  </footer>

  <div id="r-toasts" class="r-toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/js/remote.js"></script>
</body>
</html>
