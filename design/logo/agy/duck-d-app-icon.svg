<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KaraDuck app icon logo">
  <defs>
    <linearGradient id="kd-iris" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#33e1ff"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ff3d9a"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="kd-ambient" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b0714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kd-gold" gradientUnits="userSpaceOnUse" x1="110" y1="120" x2="320" y2="440">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="60%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f2b236"/>
    </linearGradient>
    <linearGradient id="kd-note" gradientUnits="userSpaceOnUse" x1="354" y1="78" x2="454" y2="204">
      <stop offset="0%" stop-color="#33e1ff"/>
      <stop offset="100%" stop-color="#ff3d9a"/>
    </linearGradient>
  </defs>

  <!-- App icon base card -->
  <rect width="512" height="512" rx="112" fill="#0b0714"/>
  <rect width="512" height="512" rx="112" fill="url(#kd-ambient)"/>

  <!-- Singing duck face -->
  <path d="M174 186C152 140 178 106 208 136C226 112 260 128 244 186Z" fill="url(#kd-gold)"/>
  <circle cx="214" cy="304" r="140" fill="url(#kd-gold)"/>

  <!-- Eyes -->
  <ellipse cx="154" cy="240" rx="19" ry="25" fill="#140a24"/>
  <ellipse cx="274" cy="240" rx="19" ry="25" fill="#140a24"/>

  <!-- Wide flat open singing duck bill -->
  <path d="M142 320L286 320C282 378 254 412 214 412C174 412 146 378 142 320Z" fill="#210a33"/>
  <path d="M176 382C192 356 236 356 252 382C238 404 190 404 176 382Z" fill="#ff3d9a"/>
  <path d="M134 338C138 392 170 424 214 424C258 424 290 392 294 338L274 342C268 380 246 400 214 400C182 400 160 380 154 342Z" fill="#f05a46"/>
  <path d="M110 322C110 292 158 282 214 282C270 282 318 292 318 322C318 342 272 338 214 338C156 338 110 342 110 322Z" fill="#ff7c4d"/>

  <!-- Single musical note -->
  <ellipse cx="384" cy="182" rx="30" ry="22" transform="rotate(-20 384 182)" fill="url(#kd-note)"/>
  <path d="M406 174L406 80C432 88 450 106 454 132" fill="none" stroke="url(#kd-note)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iridescent neon border -->
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#kd-iris)" stroke-width="20"/>
</svg>
