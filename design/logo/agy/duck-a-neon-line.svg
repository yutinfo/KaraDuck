    <circle stroke-width="20" cx="416" cy="258" r="42"/>
    <path stroke-width="16" d="M382 270Q416 258 450 246"/>
    <path stroke-width="20" d="M402 298L422 412C426 432 456 426 456 404L444 290"/>
    <!-- Singing sound waves -->
    <path stroke-width="18" d="M382 134Q408 144 416 172"/>
