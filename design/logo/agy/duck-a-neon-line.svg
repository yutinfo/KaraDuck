<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KaraDuck neon line logo">
  <defs>
    <linearGradient id="ka-neon" gradientUnits="userSpaceOnUse" x1="56" y1="74" x2="466" y2="434">
      <stop offset="0%" stop-color="#33e1ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff3d9a"/>
    </linearGradient>
    <filter id="ka-glow" filterUnits="userSpaceOnUse" x="16" y="16" width="480" height="480">
