    <path stroke-width="24" d="M382 270Q416 258 450 246"/>
    <path stroke-width="28" d="M402 298L422 412C426 432 456 426 456 404L444 290"/>
    <path stroke-width="24" d="M382 134Q408 144 416 172"/>
    <path stroke-width="24" d="M404 94Q446 112 458 158"/>
