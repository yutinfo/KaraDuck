<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>KaraDuck — ตัวเลือกโลโก้</title>
<style>
  body{margin:0;background:#06050c;color:#f5f3ff;font:15px/1.4 system-ui,-apple-system,"Sukhumvit Set",sans-serif;padding:20px 24px 28px}
  h1{font-size:20px;margin:0 0 4px} p{margin:0 0 16px;color:#b3acd0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .big{width:100%;aspect-ratio:1;border-radius:12px;background:#06050c;object-fit:contain}
  .row{display:flex;align-items:center;gap:12px}
  .row img{border-radius:8px;background:#06050c}
  .tag{font-weight:700;font-size:18px;color:#ffd166} .by{color:#b3acd0;font-size:13px}
  .bar{display:flex;align-items:center;gap:8px;background:rgba(12,10,24,.7);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 10px;font-weight:700}
  .bar img{border-radius:6px}
  h2{font-size:15px;margin:18px 0 8px;color:#33e1ff}
</style></head><body>
<h1>โลโก้เป็ดร้องเพลง — 8 แนว</h1>
<p>ภาพใหญ่ · ขนาดไอคอน 64 และ 32 · ตัวอย่างบนแถบหัวเว็บ</p>
<h2>Codex (วาดเป็นภาพ)</h2>
<div class="grid" id="codex"></div>
<h2>agy (เขียนเป็น SVG)</h2>
<div class="grid" id="agy"></div>
<script>
const sets={codex:[['1','ลายเส้นนีออน','codex/duck-1-neon-line.png'],['2','มาสคอต','codex/duck-2-mascot.png'],['3','มินิมอล','codex/duck-3-minimal.png'],['4','ไอคอนแอป','codex/duck-4-app-icon.png']],
agy:[['A','ลายเส้นนีออน','agy/duck-a-neon-line.svg'],['B','มาสคอต','agy/duck-b-mascot.svg'],['C','มินิมอล','agy/duck-c-minimal.svg'],['D','ไอคอนแอป','agy/duck-d-app-icon.svg']]};
for(const [id,items] of Object.entries(sets)){const g=document.getElementById(id);for(const [tag,name,src] of items){const c=document.createElement('div');c.className='card';
const head=document.createElement('div');head.className='row';const t=document.createElement('span');t.className='tag';t.textContent=tag;const b=document.createElement('span');b.className='by';b.textContent=name;head.append(t,b);
const big=new Image();big.src=src;big.className='big';
const small=document.createElement('div');small.className='row';for(const s of [64,32]){const i=new Image();i.src=src;i.width=s;i.height=s;small.append(i);}
const bar=document.createElement('div');bar.className='bar';const bi=new Image();bi.src=src;bi.width=28;bi.height=28;const bt=document.createElement('span');bt.textContent='KaraDuck';bar.append(bi,bt);small.append(bar);
c.append(head,big,small);g.append(c);}}
</script></body></html>
