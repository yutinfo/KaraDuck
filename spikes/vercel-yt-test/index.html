<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบ YouTube</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b12; --card: #161622; --line: #2a2a3c; --text: #ececf4; --dim: #9a9ab0; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --accent: #7c5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Sukhumvit Set", "Noto Sans Thai", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 16px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  #verdict { font-weight: 700; padding: 12px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); margin-bottom: 16px; }
  #verdict[data-state="pass"] { border-color: var(--ok); color: var(--ok); }
  #verdict[data-state="fail"] { border-color: var(--bad); color: var(--bad); }
  #verdict[data-state="warn"] { border-color: var(--warn); color: var(--warn); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  td.ok { color: var(--ok); } td.bad { color: var(--bad); }
  td.sample { white-space: normal; color: var(--dim); min-width: 180px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  textarea { width: 100%; height: 120px; background: var(--card); color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>ทดสอบ YouTube จากเซิร์ฟเวอร์นี้</h1>
  <p>ยิงค้นเพลง 24 ครั้งและตรวจเพลงที่ฝังได้ 20 เพลง เพื่อดูว่า YouTube ยอมให้เซิร์ฟเวอร์ตัวนี้ใช้งานไหม</p>
  <div class="bar">
    <button id="start">เริ่มทดสอบ</button>
    <button id="copy" class="ghost" disabled>คัดลอกผล</button>
    <span id="progress"></span>
  </div>
  <div id="verdict">ยังไม่ได้ทดสอบ</div>

  <h2>ค้นหา</h2>
  <div class="wrap"><table>
    <thead><tr><th>#</th><th>คำค้น</th><th>ผล</th><th>จำนวน</th><th>มิลลิวินาที</th><th>ตัวอย่าง</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>

  <h2>ตรวจเพลงที่ฝังได้</h2>
  <div id="embed">รอผลค้นหา</div>

  <h2>ผลดิบ</h2>
  <textarea id="raw" readonly></textarea>
</main>
<script>
const QUERIES = [
  'กล้าพอไหม', 'เพื่อนสนิท', 'ลมหายใจ', 'คู่กัด', 'ขอใจเธอแลกเบอร์โทร', 'เรือเล็กควรออกจากฝั่ง',
  'ฤดูที่แตกต่าง', 'แพ้ทาง', 'ยิ่งคุยยิ่งเหงา', 'รักแท้ดูแลไม่ได้', 'ภาพจำ', 'ทิ้งไว้กลางทาง',
  'หยุดรักยังไง', 'คำแพง', 'สาวบางโพ', 'ไก่จ๋า', 'เต่างอย', 'ปูหนีบอีปิ',
  'bohemian rhapsody', 'my way', 'perfect ed sheeran', 'let it go', 'dancing queen', 'yesterday',
];
const key = new URLSearchParams(location.search).get('key');
const withKey = url => key ? `${url}&key=${encodeURIComponent(key)}` : url;
const $ = id => document.getElementById(id);
const report = { startedAt: null, region: null, searches: [], embed: null };

function cell(row, text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  row.append(td);
}

async function getJson(url) {
  const started = performance.now();
  try {
    const response = await fetch(withKey(url), { cache: 'no-store' });
    const body = await response.json();
    return { ...body, roundTripMs: Math.round(performance.now() - started) };
  } catch (error) {
    return { ok: false, error: `เรียกเซิร์ฟเวอร์ไม่ได้: ${error.message}`, roundTripMs: Math.round(performance.now() - started) };
  }
}

function setVerdict(state, text) {
  $('verdict').dataset.state = state;
  $('verdict').textContent = text;
}

async function run() {
  $('start').disabled = true;
  $('copy').disabled = true;
  $('rows').replaceChildren();
  $('embed').textContent = 'รอผลค้นหา';
  report.startedAt = new Date().toISOString();
  report.searches = [];
  report.embed = null;
  setVerdict('', 'กำลังทดสอบ…');

  const ids = [];
  for (const [index, q] of QUERIES.entries()) {
    $('progress').textContent = `ค้นหา ${index + 1}/${QUERIES.length}`;
    const result = await getJson(`/api/search?q=${encodeURIComponent(q)}`);
    report.region ??= result.region ?? null;
    report.searches.push({ q, ...result });
    const good = result.ok && result.count >= 5;
    const row = document.createElement('tr');
    cell(row, String(index + 1));
    cell(row, q);
    cell(row, good ? 'ผ่าน' : (result.error ?? `HTTP ${result.http}`), good ? 'ok' : 'bad');
    cell(row, result.ok ? String(result.count) : '–');
    cell(row, String(result.ms ?? result.roundTripMs));
    cell(row, result.sample?.[0] ?? '', 'sample');
    $('rows').append(row);
    for (const id of result.ids ?? []) if (ids.length < 20 && !ids.includes(id)) ids.push(id);
  }

  let embedBad = 0;
  if (ids.length) {
    $('progress').textContent = 'ตรวจเพลงที่ฝังได้';
    const result = await getJson(`/api/embeddable?ids=${ids.join(',')}`);
    report.embed = result;
    const list = result.results ?? [];
    const yes = list.filter(item => item.embeddable === true).length;
    const no = list.filter(item => item.embeddable === false).length;
    embedBad = list.filter(item => item.embeddable === null).length + (result.ok ? 0 : ids.length);
    $('embed').textContent = result.ok
      ? `ตรวจ ${list.length} เพลงใน ${result.ms} มิลลิวินาที: ฝังได้ ${yes} · ฝังไม่ได้ ${no} · ตรวจไม่สำเร็จ ${embedBad}`
      : `ตรวจไม่สำเร็จ: ${result.error}`;
  } else {
    $('embed').textContent = 'ไม่มีผลค้นหาให้ตรวจ';
  }

  const passed = report.searches.filter(item => item.ok && item.count >= 5).length;
  const total = QUERIES.length;
  const where = report.region ? ` (ภูมิภาค ${report.region})` : '';
  if (passed === total && embedBad === 0) setVerdict('pass', `ผ่าน: ค้นได้ ${passed}/${total} และตรวจเพลงได้ครบ${where}`);
  else if (passed === total) setVerdict('warn', `ค้นได้ครบ ${passed}/${total} แต่ตรวจเพลงไม่สำเร็จ ${embedBad} เพลง${where}`);
  else if (passed === 0) setVerdict('fail', `ไม่ผ่าน: ค้นไม่ได้เลย${where}`);
  else setVerdict('warn', `ไม่นิ่ง: ค้นได้ ${passed}/${total}${where}`);

  $('raw').value = JSON.stringify(report);
  $('progress').textContent = 'เสร็จแล้ว';
  $('start').disabled = false;
  $('copy').disabled = false;
}

$('start').addEventListener('click', run);
$('copy').addEventListener('click', async () => {
  $('raw').select();
  try { await navigator.clipboard.writeText($('raw').value); $('progress').textContent = 'คัดลอกแล้ว'; }
  catch { $('progress').textContent = 'เลือกข้อความไว้ให้แล้ว กดคัดลอกเอง'; }
});
</script>
</body>
</html>
